<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- ----LINK : CSS---- -->
    
</head>
<style>
    h1{
    display: inline;
    }
    .one{
        color: lightblue;
    }
    .two{
        color: lightgreen;
    }
    .three{
        color:lightslategray
    }
</style>
<body>

    <!-- 
    DISPLAY P0RPERTY:
    1.Inline
    2.Block
    3.Inline-Block
    4.None
     -->

   <!-- 
    BLOCK ELEMENT: <p>, <h1>..<h6> , <div> , <form> , list => <ul> <li>
    INLINE ELEMENT: <span> , <img> , <a>    
    INLINE BLOCK ELEMENT: <img>
    -->

    <h1 class="one">Let's</h1>
    <h1 class="two">get</h1>
    <h1 class="three">Started</h1>
    <br>

    <h1> <span class="one">Let's</span> <span class="two">get</span> <span class="three">Started</span></h1>


    <!-- 
    NOTE:
    1. Height & width of a "inline element" can't be defined
    2. To define height & width, use "display : inline-block"
    
    -->
    

</body>
</html>
