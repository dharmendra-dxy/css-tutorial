<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS | Flex </title>
    <!-- ---------LINK : CSS---------------- -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 
        justify-content : align items in "x-axis"
        align-item : align items in "y-axis" 

        Flex PARENT PROPERTY:
            1. flex-direction : row, row-reverse, column, column-reverse
            2. flex-wrap : wrap, wrap-reverse
            3. flex-flow :  "flex-flow : flex-wrap + flex-direction ;"
            4. justify-content : space-around, space-between, centre, flex-start, flex-end
            5. align-item : stretch(default value), centre, flex-start, flex-end
            6. align-content : centre, flex-start, flex-end, space-between, space-even

            #. gap : defines a gap btwn child elements


        Flex CHIDREN PROPERTY:
            1. order : shifts at the end : 1,2,3... => default value = 0
            2. flex-grow : takes the space availabe to it: 1,2,3,... => default value = 0
            3. flex-shrink : default value = 1 ; item shrinks fastly at time of shrink
            4. flex-basis : defines the initial width along x-axis
            5. flex : " flex : flex-grow flex-shrink flex-basis ;"
            6. align-self : align itself in "y-axis"

     -->
    
    <div class="container">
        <div class="box" id="box-1">box-1 order, flex-grow</div>
        <div class="box" id="box-2">box-2</div>
        <div class="box" id="box-3">box-3 flex-grow</div>
        <div class="box" id="box-4">box-4 flex-shrink</div>
        <div class="box" id="box-5">box-5</div>
        <div class="box" id="box-6">box-6</div>
        <div class="box" id="box-7">box-7</div>
        <div class="box" id="box-8">box-8 flex-basis</div>
    </div>



</body>
</html>
