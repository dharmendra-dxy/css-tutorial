<body>
    <!-- 
        CSS Animation Properties:
            1.  animation-name
            2.  animation-duration
            3.  animation-delay
            4.  animation-iteration-count => tells the number of repition of animation
            5.  animation-direction => noraml, reverse, alternate, alternate-reverse
            6.  animation-timing-finction => ease, linear, ease-in, ease-out, ease-in-out
            7.  animation-fill-mode => none, forward, backward, both => it specifes the task to the element when the task in not performed by the element.

        

     -->
    <div class="container">

        <div class="box"></div>
    </div>

    <div class="loader">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</body>
